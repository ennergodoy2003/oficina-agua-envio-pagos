spring.application.name=consumer
server.port=8082

# Lee el .env de la raiz del repo (los valores reales nunca van en el codigo)
spring.config.import=optional:file:../.env[.properties];optional:file:./.env[.properties]

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Politica de fallos del listener (provisional hasta HU-48)
# Una excepcion NO reencola: el mensaje va a pagos.dlx -> pagos.dlq
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Una carta a la vez, un solo hilo: suave con el banco
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1

# API del banco (valores solo en .env)
banco.url=${BANCO_URL}
banco.api-key=${BANCO_API_KEY}
banco.team-code=${BANCO_TEAM_CODE}

# Timeouts de Feign (ms), ~3 s sugeridos
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# DynamoDB Logs (HU-46). En local apunta a DynamoDB Local del compose.
dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
dynamodb.region=${DYNAMODB_REGION:us-east-1}
dynamodb.table=${DYNAMODB_TABLE:pagos-envio-logs}