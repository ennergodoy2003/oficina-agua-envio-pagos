# Feature 3: envío de pagos. Infraestructura local.
# Requiere un archivo .env (copia de .env.example).

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?falta RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Contenedor de un solo uso: aplica exchanges, colas y bindings (HU-42).
  rabbitmq-init:
    image: curlimages/curl
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?falta RABBITMQ_USER en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        curl --fail --silent --show-error
        --retry 10 --retry-delay 3 --retry-connrefused
        -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD"
        -H "content-type: application/json"
        -X POST http://rabbitmq:15672/api/definitions
        --data-binary @/definitions.json
        && echo "Topologia de RabbitMQ aplicada"

  # Libro de registro de envíos (HU-46). DynamoDB Local guarda en un volumen.
  dynamodb:
    image: amazon/dynamodb-local
    restart: unless-stopped
    user: root
    working_dir: /home/dynamodblocal
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  # Contenedor de un solo uso: crea la tabla de logs si no existe (HU-46).
  # Las claves "local" no son secretas: DynamoDB Local solo exige que existan.
  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ${DYNAMODB_REGION:-us-east-1}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-pagos-envio-logs}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 > /dev/null 2>&1; do
          echo "Esperando a DynamoDB Local..."
          sleep 2
        done
        if aws dynamodb describe-table --table-name "$$DYNAMODB_TABLE" --endpoint-url http://dynamodb:8000 > /dev/null 2>&1; then
          echo "La tabla $$DYNAMODB_TABLE ya existe"
        else
          aws dynamodb create-table \
            --table-name "$$DYNAMODB_TABLE" \
            --attribute-definitions AttributeName=numeroDocumento,AttributeType=S AttributeName=claveIntento,AttributeType=S \
            --key-schema AttributeName=numeroDocumento,KeyType=HASH AttributeName=claveIntento,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --stream-specification StreamEnabled=true,StreamViewType=NEW_IMAGE \
            --endpoint-url http://dynamodb:8000 > /dev/null \
          && echo "Tabla $$DYNAMODB_TABLE creada"
        fi

  # Banco falso para pruebas locales. Responde segun wiremock/banco/mappings.
  # No es el simulador del ingeniero: ese se usa en HU-61.
  banco-falso:
    image: wiremock/wiremock:3.9.2
    restart: unless-stopped
    ports:
      - "${BANCO_FALSO_PORT:-8089}:8080"
    volumes:
      - ./wiremock/banco/mappings:/home/wiremock/mappings:ro
    command: ["--global-response-templating", "--verbose"]
  # ERP falso para pruebas locales. Responde segun wiremock/erp/mappings.
  # No es el simulador del ingeniero: ese se usa en HU-61.
  erp-falso:
    image: wiremock/wiremock:3.9.2
    restart: unless-stopped
    ports:
      - "${ERP_FALSO_PORT:-8090}:8080"
    volumes:

      - ./wiremock/erp/mappings:/home/wiremock/mappings:ro

    command: ["--global-response-templating", "--verbose"]
  # Lambda de HU-49 en local: lee el stream de DynamoDB Local y marca pagos_envio en MariaDB.
  lambda-marcar-flags:
    build: ./lambda/marcar_flags
    restart: unless-stopped
    depends_on:
      - dynamodb
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-pagos-envio-logs}
      AWS_DEFAULT_REGION: ${DYNAMODB_REGION:-us-east-1}
      DB_HOST: ${LAMBDA_DB_HOST:-host.docker.internal}
      DB_PORT: ${PAGOS_DB_PORT:-3306}
      DB_NAME: ${PAGOS_DB_NAME:?falta PAGOS_DB_NAME en .env}
      DB_USER: ${LAMBDA_DB_USER:?falta LAMBDA_DB_USER en .env}
      DB_PASSWORD: ${LAMBDA_DB_PASSWORD:?falta LAMBDA_DB_PASSWORD en .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  rabbitmq_data:
  dynamodb_data: