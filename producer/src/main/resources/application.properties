spring.application.name=producer
server.port=8081

# Lee el .env de la raiz del repo (los valores reales nunca van en el codigo)
spring.config.import=optional:file:../.env[.properties];optional:file:./.env[.properties]

# Swagger UI dibuja el contrato escrito a mano, no uno generado desde el codigo
springdoc.swagger-ui.url=/contrato/producer-api.yaml

# BD de pagos (usuario de solo lectura)
spring.datasource.url=jdbc:mariadb://${PAGOS_DB_HOST:localhost}:${PAGOS_DB_PORT:3306}/${PAGOS_DB_NAME}
spring.datasource.username=${PAGOS_DB_USER}
spring.datasource.password=${PAGOS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# DynamoDB Logs (HU-46): el producer solo LEE el historial de envios
dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
dynamodb.region=${DYNAMODB_REGION:us-east-1}
dynamodb.table=${DYNAMODB_TABLE:pagos-envio-logs}